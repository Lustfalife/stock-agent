name: Trade Tracker

on:
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Update trade log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADELOG_URL: ${{ secrets.TRADELOG_URL }}
          TRADELOG_KEY: ${{ secrets.TRADELOG_KEY }}
        run: python track_intraday.py
