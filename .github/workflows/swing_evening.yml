name: Swing Evening Scan

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode (works any time, nothing is logged)"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run swing evening scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADELOG_URL: ${{ secrets.TRADELOG_URL }}
          TRADELOG_KEY: ${{ secrets.TRADELOG_KEY }}
          TEST_ONCE: ${{ inputs.test && '1' || '' }}
        run: python swing_evening.py
